[project]
name = "astray"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "httpx>=0.27",
    "sympy>=1.13",
    "python-multipart>=0.0.12",
    "pyyaml>=6.0",
]

[dependency-groups]
dev = ["pytest>=8.3", "pytest-asyncio>=0.24", "ruff>=0.7"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
# The design docs are a historical record of what the spec and plan literally
# said during execution. Ruff formats Python blocks embedded in markdown, which
# would silently rewrite that record -- and their code blocks are illustrative,
# not compiled. Source, tests, and evals stay covered.
exclude = ["docs"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
